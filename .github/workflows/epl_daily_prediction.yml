name: 英超预测自动化定时任务

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 2.5 安装中文字体
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei

      - name: 3. 安装依赖（使用清华镜像加速）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 3.5 云端 V15 自动调参与训练
        run: python train_v15.py

      - name: 4. 运行赛前预测
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python final_prediction.py

      - name: 5. 运行赛后复盘
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python auto_review_llm.py

      - name: 6. 自动提交更新的数据与经验
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add epl_matches_10y.csv
          git add knowledge.txt || true
          git add predictions_log.csv || true
          git add bankroll.csv || true
          git add odds_history.csv || true
          git commit -m "自动更新比赛数据、预测日志及资金库 [skip ci]" || echo "没有新数据需要更新"
          git push
