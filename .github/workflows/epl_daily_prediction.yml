name: 足球预测及复盘自动化任务

permissions:
  contents: write

on:
  schedule:
    # UTC 8:00 (北京时间 16:00) 触发预测
    - cron: '0 8 * * *'
    # UTC 4:00 (北京时间 12:00) 触发复盘
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装系统依赖与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei libgomp1
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100
      
      - name: 1. 抓取五大联赛历史赛果
        run: python fetch_league_history.py
      - name: 2. 抓取真实 xG 数据
        run: python fetch_xg.py
      - name: 3. 训练 V44.0 终极模型
        run: python train_v31.py
      - name: 4. 抓取今日赛程与赔率
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_multi_leagues.py
      - name: 4.2 抓取真实裁判及教练数据
        run: python fetch_referee_coach.py
      - name: 4.4 运行赛前预测 (下午4点)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python final_prediction.py
      - name: 4.5 运行时光机回测系统
        run: python backtest.py
      - name: 5. 自动提交更新的数据
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "V46.0 自动更新预测数据 [skip ci]" || echo "无变化"
          git pull --rebase origin main
          git push

  run-review:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100
      
      - name: 1. 运行深度复盘 (次日中午12点)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python auto_review_llm.py
      
      - name: 2. 自动提交复盘数据
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add knowledge.txt bankroll.csv predictions_log.csv
          git commit -m "V46.0 自动更新复盘经验与资金库 [skip ci]" || echo "无变化"
          git pull --rebase origin main
          git push
