name: 英超预测及复盘自动化任务

permissions:
  contents: write

on:
  schedule:
    # 每天 UTC 2:00 (北京时间 10:00) 触发预测
    - cron: '0 2 * * *'
    # 每天 UTC 8:00 (北京时间 16:00) 触发复盘
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    # 如果是在下午 4 点触发的，就跳过预测任务，节省资源
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 2.5 安装系统依赖与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei libgomp1

      - name: 3. 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100
      
      - name: 3.1 抓取五大联赛历史赛果 (粮仓)
        run: python fetch_league_history.py
        
      - name: 3.2 抓取真实 xG 数据
        run: python fetch_xg.py

      - name: 3.5 训练 V27.0 终极模型
        run: python train_v31.py

      - name: 3.8 抓取全球真实盘口 (PinnWire)
        env:
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
        run: python fetch_real_odds.py

      - name: 4. 抓取多联赛赛程并融合赔率
        run: python fetch_multi_leagues.py

      - name: 4.2 抓取真实裁判及教练风格数据
        run: python fetch_referee_coach.py

      - name: 4.4 运行赛前预测 (Elo+融合模型)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python final_prediction.py

      # 🌟 核心补漏：把沉睡的回测系统叫醒！
      - name: 4.5 运行时光机回测系统
        run: python backtest.py

      - name: 5. 自动提交更新的数据与经验
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "V44.0 自动更新预测数据与回测报告 [skip ci]" || echo "没有新数据需要更新"
          git pull --rebase origin main
          git push

  run-review:
    runs-on: ubuntu-latest
    # 只有在下午 4 点定时触发时，才执行复盘
    if: github.event.schedule == '0 8 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100
      
      - name: 1. 运行深度错题复盘
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python auto_review_llm.py
      
      - name: 2. 自动提交更新的经验与资金库
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add knowledge.txt bankroll.csv predictions_log.csv
          git commit -m "V32.0 自动更新复盘经验与资金库 [skip ci]" || echo "无变化"
          git push
