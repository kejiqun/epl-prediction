name: 英超预测自动化定时任务

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * 6'
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🌟 核心修改：显式安装指定版本的 libgomp1，防止 XGBoost 崩溃
      - name: 2.5 安装系统依赖与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei libgomp1=10-20200411-2ubuntu3

      - name: 3. 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100

      - name: 3.1 抓取五大联赛历史赛果 (建粮仓)
        run: python fetch_league_history.py

      - name: 3.5 云端 V31 融合调参与训练
        run: python train_v31.py

      - name: 3.8 抓取多联赛赛程与实时赔率
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_multi_leagues.py

      - name: 3.9 抓取真实裁判及教练风格数据
        run: python fetch_referee_coach.py

      - name: 4. 运行赛前预测 (裁判与教练介入版)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python final_prediction.py

      - name: 4.5 运行时光机回测系统
        run: python backtest.py

      - name: 5. 运行赛后复盘 (多联赛结算+知识提纯)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python auto_review_llm.py

      - name: 6. 自动提交更新的数据与经验
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add all_leagues_matches.csv || true
          git add epl_matches_10y.csv || true
          git add knowledge.txt || true
          git add predictions_log.csv || true
          git add bankroll.csv || true
          git add odds_history.csv || true
          git add dashboard.html || true
          git add backtest_report.txt || true
          git add backtest_roi.png || true
          git add daily_matches.csv || true
          git add referee_stats.csv || true
          git add coach_stats.csv || true
          git commit -m "自动更新 V18.0 数据、经验及资金库 [skip ci]" || echo "没有新数据需要更新"
          git push
