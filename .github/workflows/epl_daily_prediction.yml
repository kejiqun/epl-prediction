name: 英超预测自动化定时任务

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * 6'
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 2.5 安装系统依赖与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei libgomp1

      - name: 3. 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100

      - name: 3.1 抓取五大联赛历史赛果 (粮仓)
        run: python fetch_league_history.py

      - name: 3.2 抓取真实 xG 数据
        run: python fetch_xg.py

      - name: 3.5 训练 V25.0 终极模型
        run: python train_v31.py

      - name: 3.8 抓取国内真实盘口 (死磕版)
        run: python fetch_domestic_odds.py

      - name: 4. 抓取多联赛赛程与实时赔率
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_multi_leagues.py

      - name: 4.2 抓取真实裁判及教练风格数据
        run: python fetch_referee_coach.py

      - name: 4.4 运行赛前预测 (Elo+融合模型)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python final_prediction.py

      - name: 4.5 运行时光机回测系统
        run: python backtest.py

      # 🌟 核心新增：错题归因复盘
      - name: 4.6 运行深度错题复盘
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python auto_review_llm.py

      - name: 5. 自动提交更新的数据与经验
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "V25.0 全自动运行：更新数据、回测及错题经验 [skip ci]" || echo "没有新数据需要更新"
          git push
