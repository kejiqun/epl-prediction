name: 英超预测自动化定时任务

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * 6'
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-prediction:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖与中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei libgomp1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --default-timeout=100

      - name: 1. 抓取五大联赛历史赛果 (粮仓)
        run: python fetch_league_history.py

      - name: 2. 抓取真实 xG 数据 (升级版)
        run: python fetch_xg.py

      - name: 3. 训练 V19.0 模型
        run: python train_v31.py

      - name: 4. 抓取多联赛赛程与实时赔率
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_multi_leagues.py

      - name: 5. 抓取真实裁判及教练风格数据
        run: python fetch_referee_coach.py

      - name: 6. 运行赛前预测 (xG与疲劳度版)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python final_prediction.py

      - name: 7. 自动提交更新数据
        run: |
          git config --global user.name "Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "V19.0 自动更新数据与经验 [skip ci]" || echo "无变化"
          git push
